[project]
name = "nlp"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "peft>=0.21.2",
    "polars>=2.0.0",
    "rank-bm25>=0.2.2",
    "torch>=2.14.1",
    "transformers>=5.21.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "jupyter-cache>=1.0.1",
    "ptpython>=3.0.32",
]
