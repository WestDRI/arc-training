[project]
name = "pt2"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "timm>=1.0",
    "torchmetrics>=1.0",
    "safetensors>=0.4",
    "numpy>=2.5.1",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "jupyter-cache>=1.0.1",
    "ptpython>=3.0.32",
]
